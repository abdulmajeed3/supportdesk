name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Type-check, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportdesk_test
          POSTGRES_PASSWORD: supportdesk_test_password
          POSTGRES_DB: supportdesk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://supportdesk_test:supportdesk_test_password@localhost:5433/supportdesk_test

      - name: Run migrations (test DB)
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://supportdesk_test:supportdesk_test_password@localhost:5433/supportdesk_test

      - name: Run tests
        working-directory: apps/backend
        run: npm test
        env:
          DATABASE_URL: postgresql://supportdesk_test:supportdesk_test_password@localhost:5433/supportdesk_test
          TEST_DATABASE_URL: postgresql://supportdesk_test:supportdesk_test_password@localhost:5433/supportdesk_test
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Build
        working-directory: apps/backend
        run: npm run build

  frontend:
    name: Frontend — Lint, Type-check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run tests
        working-directory: apps/frontend
        run: npm test

      - name: Build
        working-directory: apps/frontend
        run: npm run build
